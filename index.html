<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script>
  // 옛 주소(github.io) → 전용 주소 minsung-invest.web.app (2026-10-15 이전).
  // 2026-11-14: 「새 주소로 이동」 띠만 띄우던 것을 바로 넘기도록 바꿨다 — 옛 주소는 다른 웹앱들과 저장소를 나눠 쓰는 주소인데
  // 옛 판 앱이 거기서 통째로 돌고 있었다. 기기에만 있는 설정(지표 목록·지운 지표)은 종전 띠와 같은 방식(#move=)으로 실어 보내고,
  // 새 주소가 한 번 받아 저장한다(이미 설정을 가진 기기는 안 받는다 — 아래 importMovedSettings).
  // 동기화 키는 싣지 않는다 — 새 주소는 늘 매일 수집되는 문서(0000)에 붙는다.
  // 이 주소에 남은 이 앱의 것(기록 사본·서비스워커·캐시)은 지운다. 설정 두 칸은 남긴다(넘어가다 끊겨도 다음에 다시 실어 보낼 수 있게).
  (function () {
    if (!/(^|\.)github\.io$/.test(location.hostname)) return;
    window.__investMoved = true;   // 아래 본문 스크립트의 시작(INIT)·서비스워커 등록이 이 표시를 보고 아무것도 하지 않는다
    var data = {};
    try {
      ['invest_indicators_v1', 'invest_indicators_removed_v1'].forEach(function (k) { var v = localStorage.getItem(k); if (v !== null) data[k] = v; });
      ['invest_tracker_v2', 'invest_tracker_v2_ver', 'gold_recalc_troy_v1', 'invest_sync_key', 'invest_sync_off'].forEach(function (k) { localStorage.removeItem(k); });
    } catch (e) {}
    var hash = '';
    try {
      if (Object.keys(data).length) hash = '#move=' + btoa(unescape(encodeURIComponent(JSON.stringify(data)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    } catch (e) {}
    try { document.documentElement.style.visibility = 'hidden'; } catch (e) {}   // 넘어가기 전 빈 표가 비치지 않게
    var go = function () { location.replace('https://minsung-invest.web.app/' + hash); };
    try {
      var jobs = [];
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
        jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
          return Promise.all(rs.filter(function (r) { return /\/invest-tracker\//.test(r.scope); }).map(function (r) { return r.unregister(); }));
        }));
      }
      if (window.caches) {
        jobs.push(caches.keys().then(function (ks) {
          return Promise.all(ks.filter(function (k) { return k.indexOf('invest-tracker-') === 0; }).map(function (k) { return caches.delete(k); }));
        }));
      }
      Promise.race([Promise.all(jobs), new Promise(function (r) { setTimeout(r, 1500); })]).then(go, go);
    } catch (e) { go(); }
  })();
  </script>
  <title>투자 지표 트래커</title>
  <link rel="manifest" href="./manifest.json">
  <script>
    // 탭이면 가로용 설정 파일(manifest-tab.json, "landscape")로 바꿔 끼운다 — 폰·폴드는 manifest.json("natural" = 세로) 그대로 (2026-11-24).
    // 설치할 때 그 페이지에 걸린 설정 파일의 방향이 설치 앱에 박힌다 → 탭은 열 때부터 가로. 영어 앱에서 먼저 확인(탭 S7+ ✓).
    // JS 잠금(screen.orientation.lock)은 안드로이드에서 전체 화면일 때만 허락돼 쓰지 않는다. manifest 두 벌 — 이름·아이콘을 고치면 둘 다.
    // 탭 = 화면 짧은 변 600 이상 + 긴 변/짧은 변 1.3 이상 (폴드 펼침 약 1.1 · 폰 600 미만). 주소에 ?tab=1 / ?tab=0 이면 그 값이 이긴다.
    // 규칙은 LifeOS apps-internals screen-layout.md 「화면 방향」.
    (function () {
      try {
        var a = Math.min(screen.width, screen.height), b = Math.max(screen.width, screen.height);
        var q = /[?&]tab=([01])/.exec(location.search);
        if (q ? q[1] === '1' : (a >= 600 && b / a >= 1.3)) document.querySelector('link[rel="manifest"]').href = './manifest-tab.json';
      } catch (e) {}
    })();
  </script>

  <style>
/* 맨 위에서 아래로 당기면 크롬이 페이지를 새로고침하던 것을 막는다 (2026-09-28 사용자 요청) */
html, body { overscroll-behavior-y: none; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #1d4ed8;
      --primary-light: #dbeafe;
      --bg: #f1f5f9;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --up: #dc2626;      /* 오르면 빨강 */
      --down: #2563eb;    /* 내리면 파랑 */
      --header-h: 56px;
      --tab-h: 60px;
    }

    html, body { height: 100%; background: var(--bg); font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; color: var(--text); }
    button { font-family: inherit; }

    /* ── HEADER ── */
    #header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: var(--header-h);
      background: var(--primary);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 8px 0 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
    }
    #header h1 { color: #fff; font-size: 17px; font-weight: 700; }

    /* ── MAIN ── */
    #main {
      position: fixed;
      top: var(--header-h); bottom: var(--tab-h); left: 0; right: 0;
      overflow: hidden;
    }

    .tab-content { display: none; height: 100%; overflow-y: auto; padding: 16px; }
    .tab-content.active { display: block; }
    /* 표 탭은 숨길 때도 치우지 않고 안 보이게만 둔다 — 표의 배치 계산을 탭을 열 때마다 다시 하느라 멈췄다 (2026-09-28).
       보일 때와 같은 크기·같은 display를 유지해야 재계산이 없다. content-visibility:hidden = 숨긴 동안 안쪽 계산을 건너뛰고 배치 결과는 보관 */
    #tab-table { contain: strict; }
    #tab-table:not(.active) { display: block; position: absolute; inset: 0; content-visibility: hidden; pointer-events: none; }

    /* ── 스와이프 애니메이션 ── */
    @keyframes swipeInFromRight { from { transform: translateX(30%); opacity: 0.2; } to { transform: translateX(0); opacity: 1; } }
    @keyframes swipeInFromLeft  { from { transform: translateX(-30%); opacity: 0.2; } to { transform: translateX(0); opacity: 1; } }
    .tab-content.active.swipe-right { animation: swipeInFromRight 0.22s ease-out; }
    .tab-content.active.swipe-left  { animation: swipeInFromLeft  0.22s ease-out; }

    /* ── BOTTOM TAB ── */
    #tabnav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
      height: var(--tab-h);
      background: var(--card);
      border-top: 1px solid var(--border);
      display: grid; grid-template-columns: repeat(4, 1fr);
    }
    .tab-btn {
      border: none; background: transparent;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3px; cursor: pointer; color: var(--text-muted); font-size: 11px;
      padding-bottom: 4px; transition: color .15s;
    }
    .tab-btn .icon { font-size: 22px; line-height: 1; }
    .tab-btn.active { color: var(--primary); }

    /* ── CARDS ── */
    .card { background: var(--card); border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); padding: 16px; margin-bottom: 12px; }
    .card-title { font-size: 12px; font-weight: 700; color: var(--text-muted); letter-spacing: .5px; }

    /* 고르는 단추 묶음 (견줄 시점 · 그래프 기간) */
    .seg { display: inline-flex; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 2px; gap: 2px; }
    .seg button {
      border: none; background: transparent; color: var(--text-muted);
      font-size: 13px; font-weight: 600; padding: 0 11px; min-height: 36px; min-width: 44px;
      border-radius: 8px; cursor: pointer; white-space: nowrap;
    }
    .seg button.active { background: var(--card); color: var(--primary); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

    /* ── 데이터 탭: 최근값 판 ── */
    .latest-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }
    .latest-asof { font-weight: 500; letter-spacing: 0; margin-left: 6px; }
    .latest-note { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; min-height: 16px; }
    .latest-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
    .lt-item {
      display: flex; flex-direction: column; justify-content: center; gap: 2px;
      min-height: 0; overflow: hidden;
      padding: 9px 12px; text-align: left;
      background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
      font-family: inherit; color: var(--text); cursor: pointer;
    }
    .lt-item:active { background: var(--primary-light); }
    .lt-name { font-size: 12px; font-weight: 600; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lt-val { font-size: 17px; font-weight: 700; white-space: nowrap; }
    .lt-chg { font-size: 12px; font-weight: 600; color: var(--text-muted); white-space: nowrap; }
    .lt-chg.up { color: var(--up); }
    .lt-chg.down { color: var(--down); }
    .lt-date { font-weight: 400; margin-left: 6px; color: var(--text-muted); font-size: 11px; }

    /* ── 데이터 탭: 백업 · 날짜 목록 ── */
    .backup-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .btn-backup {
      flex: 1; padding: 12px 8px; min-height: 44px;
      border: 1.5px solid #86efac; border-radius: 10px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      background: #f0fdf4; color: #166534;
    }
    .btn-backup:active { background: #dcfce7; }
    .records-summary { font-size: 13px; color: var(--text-muted); margin: 8px 0 0; line-height: 1.5; }
    .btn-toggle {
      width: 100%; min-height: 40px; margin-top: 10px;
      background: transparent; border: 1px dashed var(--border); border-radius: 10px;
      font-size: 13px; color: var(--text-muted); cursor: pointer;
    }
    .entry-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .entry-list:empty { display: none; }
    .entry-item {
      background: var(--card); border-radius: 10px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .entry-date { font-weight: 600; font-size: 14px; }
    .entry-count { font-size: 12px; color: var(--text-muted); }

    /* ── TABLE TAB ── */
    #tab-table { padding: 0; }
    .table-wrap { overflow: auto; height: 100%; padding: 12px 8px; }
    table { border-collapse: collapse; white-space: nowrap; font-size: 13px; }
    /* 폰에서 날짜 세 칸이 한 화면에 들어오도록 칸 여백을 줄였다 (2026-11-14 — 그전엔 두 칸) */
    th, td { border: 1px solid var(--border); padding: 7px 5px; text-align: right; }
    th { background: #f8fafc; font-weight: 600; position: sticky; top: 0; z-index: 2; }
    th:first-child { left: 0; z-index: 3; text-align: left; }
    td:first-child { position: sticky; left: 0; background: #f8fafc; font-weight: 500; text-align: left; z-index: 1; line-height: 1.35; }
    /* 이름이 긴 비율 지표(에이피알/삼성전자)는 빗금 뒤에서 줄을 바꾼다 — 첫 칸이 넓어져 날짜 칸이 밀리지 않게 */
    .nm-br::after { content: '\A'; white-space: pre; }
    tr:hover td { background: var(--primary-light); }
    tr:hover td:first-child { background: var(--primary-light); }
    /* 지표 이름 칸을 누르면 그 지표 그래프로 (2026-11-25) */
    td.nm-link { cursor: pointer; -webkit-tap-highlight-color: transparent; }
    td.nm-link:active { background: var(--primary-light); }
    /* 칸 아래 줄: 직전 기록일 대비 차이 (변화율) — 오르면 빨강, 내리면 파랑 (2026-10-12) */
    td .chg { display: block; font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    td .chg.up { color: var(--up); }
    td .chg.down { color: var(--down); }
    .no-data { text-align: center; padding: 60px 24px; color: var(--text-muted); font-size: 14px; line-height: 1.7; }

    /* ── GRAPH TAB ── */
    #tab-graph.active { display: flex; flex-direction: column; }
    .select-wrap {
      background: var(--card); border-radius: 10px;
      border: 1px solid var(--border); padding: 0 12px;
      margin-bottom: 12px; display: flex; align-items: center; gap: 8px; flex: 0 0 auto;
    }
    /* 옆 지표로 넘기는 단추 (2026-11-25) — 그래프 탭은 옆으로 밀기가 꺼져 있어, 목록을 열지 않고 훑어볼 길이 없었다 */
    .select-wrap { padding: 0 4px; gap: 4px; }
    .ind-step {
      flex: 0 0 auto; width: 44px; height: 46px; border: none; background: transparent;
      font-size: 24px; line-height: 1; color: var(--primary); cursor: pointer; border-radius: 8px;
      -webkit-tap-highlight-color: transparent;
    }
    .ind-step:active { background: var(--primary-light); }
    .select-wrap label { font-size: 13px; font-weight: 600; color: var(--text-muted); white-space: nowrap; }
    select { flex: 1; min-height: 46px; border: none; background: transparent; font-size: 15px; font-weight: 600; color: var(--text); outline: none; cursor: pointer; font-family: inherit; }
    /* 그래프가 남는 높이를 채운다 (2026-11-14 — 그전엔 300px 고정이라 폰은 아래가 비었다). 화면이 낮으면 줄이지 않고 탭이 스크롤된다 */
    #chart-area { flex: 1 0 auto; display: flex; flex-direction: column; }
    .chart-card { flex: 1 0 auto; display: flex; flex-direction: column; background: var(--card); border-radius: 12px; padding: 14px 16px; position: relative; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .chart-top { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px 10px; margin-bottom: 8px; }
    .chart-canvas-wrap { flex: 1 1 auto; position: relative; min-height: 260px; }
    .chart-canvas-wrap canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; }
    .chart-hint { font-size: 11px; color: var(--text-muted); text-align: center; margin-top: 8px; }
    .latest-val { display: flex; align-items: baseline; gap: 8px; }
    .latest-num { font-size: 26px; font-weight: 700; }
    .latest-label { font-size: 13px; color: var(--text-muted); white-space: nowrap; }
    /* 보이는 구간과 그 사이의 변화 (2026-11-25) */
    .span-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 2px; margin-bottom: 8px; font-size: 12px; color: var(--text-muted); white-space: nowrap; }
    .span-row .peak-diff { font-size: 13px; }
    /* 폰: 기간 단추를 늘 한 줄 가득 — 그전엔 지표의 단위 글자 길이에 따라 한 줄/두 줄로 바뀌어 그래프 높이가 43px 씩 들쑥날쑥했다 */
    @media (max-width: 599px) {
      .chart-top { flex-direction: column; align-items: stretch; flex-wrap: nowrap; gap: 8px; }
      .chart-top .seg { display: flex; }
      .chart-top .seg button { flex: 1; }
    }

    /* 기간 최고·최저 */
    .peak-row {
      display: flex; align-items: center; gap: 8px;
      background: #fefce8; border: 1px solid #fde047;
      border-radius: 8px; padding: 6px 10px; margin-bottom: 6px;
    }
    .peak-row.low { background: #f8fafc; border-color: var(--border); }
    .peak-label { font-size: 11px; font-weight: 700; color: #854d0e; white-space: nowrap; }
    .peak-row.low .peak-label { color: var(--text-muted); }
    .peak-val   { font-size: 14px; font-weight: 700; color: #78350f; white-space: nowrap; }
    .peak-row.low .peak-val { color: var(--text); }
    .peak-date  { font-size: 11px; color: #92400e; flex: 1; white-space: nowrap; }
    .peak-row.low .peak-date { color: var(--text-muted); }
    .peak-diff  { font-size: 12px; font-weight: 700; white-space: nowrap; color: var(--text-muted); }
    .peak-diff.up { color: var(--up); }
    .peak-diff.down { color: var(--down); }
    .no-chart { text-align: center; padding: 80px 24px; color: var(--text-muted); font-size: 14px; }

    /* ── MODAL ── */
    .modal-backdrop {
      display: none; position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,.5); backdrop-filter: blur(2px);
      align-items: flex-end; justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--card); border-radius: 20px 20px 0 0;
      width: 100%; max-width: 600px;
      padding: 20px 20px 28px;
      max-height: 90vh; overflow-y: auto;
      animation: slideUp .25s ease-out;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .modal-title { font-size: 18px; font-weight: 700; }
    .modal-close { background: var(--bg); border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 16px; cursor: pointer; color: var(--text-muted); }

    /* ── 상태 창 (☁️) ── */
    #btn-sync-open {
      background: transparent; border: none; color: #fff;
      font-size: 20px; cursor: pointer; min-width: 52px; min-height: 44px; padding: 4px 8px;
      display: flex; align-items: center; justify-content: center; gap: 4px;
    }
    .sync-dot { width: 9px; height: 9px; border-radius: 50%; background: #94a3b8; display: inline-block; flex-shrink: 0; }
    .sync-dot.connected { background: #22c55e; }
    .sync-dot.syncing { background: #f59e0b; animation: syncPulse 1s infinite; }
    .sync-dot.offline, .sync-dot.warn { background: #ef4444; }
    @keyframes syncPulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    .sync-state { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .sync-detail { font-size: 13px; color: #b45309; line-height: 1.5; margin-bottom: 4px; }
    .sync-detail:empty { display: none; }
    .sync-rows { margin: 10px 0 14px; border-top: 1px solid var(--border); }
    .sync-row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
    .sync-row span:first-child { color: var(--text-muted); white-space: nowrap; }
    .sync-row span:last-child { text-align: right; font-weight: 600; }
    .sync-actions { display: flex; flex-direction: column; gap: 8px; }
    .btn-main {
      width: 100%; min-height: 46px; padding: 10px;
      background: #0f172a; color: #fff; border: none; border-radius: 10px;
      font-size: 15px; font-weight: 600; cursor: pointer;
    }
    .btn-main.warn { background: transparent; color: #b45309; border: 1px solid #f59e0b; }
    .sync-info { font-size: 12px; color: var(--text-muted); margin-top: 12px; line-height: 1.6; }

    /* ── 설정 탭 ── */
    .settings-info { font-size: 13px; color: var(--text-muted); margin: 6px 0 14px; line-height: 1.6; }
    .btn-settings-reset {
      width: 100%; min-height: 42px; padding: 10px; margin-top: 12px;
      background: transparent; color: var(--text-muted);
      border: 1px dashed var(--border); border-radius: 10px;
      font-size: 13px; cursor: pointer;
    }
    .btn-settings-reset:active { background: var(--bg); }
    .settings-row {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 10px; margin-bottom: 5px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    }
    .settings-row.is-hidden { opacity: .55; }
    .settings-row.sortable-ghost { opacity: .4; background: var(--primary-light); border-color: var(--primary); }
    .settings-row.sortable-chosen { background: #fff; }
    .settings-row.sortable-drag { box-shadow: 0 6px 18px rgba(0,0,0,.18); cursor: grabbing; }
    .settings-row .drag-handle {
      cursor: grab; padding: 8px 8px; margin: -4px 0 -4px -6px;
      color: var(--text-muted); font-size: 18px;
      user-select: none; -webkit-user-select: none;
      touch-action: none;
      flex-shrink: 0;
    }
    .settings-row .drag-handle:active { cursor: grabbing; color: var(--primary); }
    .settings-row .ind-name { flex: 1; min-width: 0; font-size: 14px; font-weight: 500; color: var(--text); }
    .settings-row .ind-tag { font-size: 10px; color: #0284c7; background: #e0f2fe; padding: 2px 6px; border-radius: 4px; margin-left: 4px; white-space: nowrap; }
    .settings-row .ind-tag.off { color: #64748b; background: #e2e8f0; }
    .settings-row .btn-move, .settings-row .btn-hide {
      width: 36px; height: 36px; border: 1px solid var(--border);
      background: var(--card); border-radius: 6px;
      font-size: 14px; cursor: pointer; color: var(--text);
      display: flex; align-items: center; justify-content: center;
      padding: 0; flex-shrink: 0;
    }
    .settings-row .btn-hide { width: 54px; font-size: 12px; font-weight: 600; color: var(--text-muted); }
    .settings-row.is-hidden .btn-hide { color: var(--primary); border-color: var(--primary); }
    .settings-row .btn-move:active, .settings-row .btn-hide:active { background: var(--bg); }
    .settings-row .btn-move:disabled { opacity: .3; cursor: not-allowed; }

    /* Toast */
    #toast {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
      background: #0f172a; color: #fff; padding: 10px 20px;
      border-radius: 20px; font-size: 14px; z-index: 300;
      pointer-events: none; opacity: 0; transition: opacity .3s;
      width: max-content; max-width: calc(100vw - 32px); text-align: center; line-height: 1.4;
    }
    #toast.show { opacity: 1; }

    /* 태블릿 가로 전용 판 — 폰에서는 보이지 않는다 */
    .ind-picker { display: none; }
    /* 폰·폴드: 날짜 목록은 단추를 눌러야 편다. 태블릿 가로는 늘 펴 둔다(아래 블록) */
    #entry-list.collapsed { display: none; }

    /* ============ 태블릿 (2026-09-28) ============
       갤럭시 탭을 가로로 두고 쓸 때. 폰 화면(위 규칙 전부)은 건드리지 않고 넓을 때만 덮어쓴다.
       - 하단 탭 → 왼쪽 세로 레일
       - 데이터 탭: 지표별 최근값 판(왼쪽) + 저장된 날짜 목록(오른쪽)
       - 그래프: 왼쪽 지표 목록 + 화면 높이를 채우는 그래프
       - 설정: 지표 목록 세 단
       - 창은 아래에서 올라오는 시트 대신 가운데 창
       높이 500 미만(폰을 가로로 돌린 화면)은 뺀다 — 2026-11-14, 그전엔 폰 가로에도 걸려 최근값 판이 전부 잘렸다.
       이 블록은 스타일 맨 끝에 둔다 */
    @media (min-width: 900px) and (orientation: landscape) and (min-height: 500px) {
      :root { --rail-w: 92px; --header-h: 60px; }

      #header { left: var(--rail-w); padding: 0 20px 0 28px; }
      #header h1 { font-size: 19px; }
      #btn-sync-open { font-size: 22px; padding: 6px 10px; }

      #main { left: var(--rail-w); bottom: 0; }
      .tab-content { padding: 20px 28px; }
      .tab-content.active { display: flex; flex-direction: column; }
      .tab-content > * { width: 100%; max-width: 1320px; margin-left: auto; margin-right: auto; }

      /* ── 왼쪽 레일 ── */
      #tabnav {
        top: 0; bottom: 0; right: auto;
        width: var(--rail-w); height: 100%;
        display: flex; flex-direction: column; justify-content: center; gap: 4px;
        padding-left: env(safe-area-inset-left);
        border-top: none; border-right: 1px solid var(--border);
        box-shadow: 2px 0 12px rgba(0,0,0,.05);
      }
      .tab-btn { flex: 0 0 auto; padding: 12px 0; font-size: 13px; gap: 5px; }
      .tab-btn .icon { font-size: 26px; }
      .tab-btn.active { background: var(--primary-light); }

      .card { padding: 20px; border-radius: 14px; }
      .card-title { font-size: 13px; }

      /* ── 데이터 탭: 최근값 판 | 저장된 날짜 ── */
      #tab-data.active {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 300px;
        grid-template-rows: auto minmax(0, 1fr);
        gap: 0 20px;
        max-width: none;
        /* 한 화면에 다 들어오게 높이를 화면에 고정하고, 칸들이 그 안에서 줄어든다 (2026-09-28 탭에서 마지막 줄이 잘림) */
        height: 100%; box-sizing: border-box;
      }
      #tab-data > * { max-width: none; }
      #tab-data .home-latest {
        display: flex; flex-direction: column;
        grid-column: 1; grid-row: 1 / span 2;
        margin-bottom: 0; min-height: 0;
      }
      .latest-head { margin-bottom: 4px; }
      .latest-note { font-size: 13px; margin-bottom: 10px; }
      .latest-grid {
        flex: 1;
        grid-template-columns: repeat(5, minmax(0, 1fr));   /* 다섯 단 (4단이면 줄이 늘어 넘쳤다) */
        grid-auto-rows: minmax(0, 1fr);
        min-height: 0;
        gap: 10px;
      }
      .lt-item { padding: 6px 14px; }
      .lt-name { font-size: 13px; }
      .lt-val { font-size: 21px; }
      .lt-chg { font-size: 13px; }

      #tab-data .backup-row { grid-column: 2; grid-row: 1; margin-bottom: 12px; }
      .btn-backup { padding: 13px 8px; font-size: 14px; }
      #tab-data > .card:not(.home-latest) {
        grid-column: 2; grid-row: 2;
        display: flex; flex-direction: column; min-height: 0; margin-bottom: 0;
      }
      #btn-toggle-dates { display: none; }
      #entry-list, #entry-list.collapsed { display: flex; flex: 1; min-height: 0; overflow-y: auto; padding-right: 2px; }
      .entry-item { padding: 12px 16px; }
      .entry-date { font-size: 15px; }
      .entry-count { font-size: 13px; }

      /* ── 표: 글자 키우기 (화면 높이는 이미 다 쓴다) ── */
      #tab-table { padding: 0; }
      #tab-table:not(.active) { display: flex; flex-direction: column; }
      #tab-table > * { max-width: none; }
      .table-wrap { padding: 16px 28px; }
      table { font-size: 15px; }
      th, td { padding: 10px 14px; }

      /* ── 그래프: 지표 목록 | 그래프 ── */
      #tab-graph.active {
        display: grid;
        grid-template-columns: 260px minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr);
        gap: 20px;
        max-width: 1320px; margin: 0 auto; width: 100%;
      }
      #tab-graph > * { max-width: none; }
      #tab-graph .select-wrap { display: none; }
      .ind-picker {
        display: block;
        overflow-y: auto; min-height: 0;
        background: var(--card); border-radius: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08);
        padding: 6px 12px 10px;
      }
      .picker-title {
        font-size: 12px; font-weight: 700; color: var(--primary);
        padding: 6px 4px 4px; border-bottom: 2px solid var(--primary-light); margin-bottom: 1px;
      }
      /* 단추 34px·틈 5px — 지표 26개가 탭 높이에 다 들어온다 (2026-11-25, 그전엔 38px·6px 라 마지막 줄이 화면 밖이었다) */
      .picker-group { display: flex; flex-wrap: wrap; gap: 5px; }
      .picker-group .picker-title { flex: 0 0 100%; }
      .picker-btn {
        flex: 1 1 auto;
        padding: 0 10px; min-height: 34px; border: 1px solid var(--border); border-radius: 8px;
        background: var(--bg); color: var(--text);
        font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .picker-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 700; }
      #chart-area { flex: 1 1 auto; min-height: 0; }
      .chart-card { flex: 1 1 auto; min-height: 0; padding: 18px 24px; border-radius: 14px; }
      .latest-num { font-size: 34px; }
      .latest-label { font-size: 15px; }
      .peak-row { padding: 8px 14px; }
      .peak-label, .peak-date { font-size: 13px; }
      .peak-val { font-size: 17px; }
      .peak-diff { font-size: 14px; }
      .span-row { font-size: 13px; }
      .span-row .peak-diff { font-size: 14px; }
      .chart-canvas-wrap { min-height: 240px; }
      .chart-hint { font-size: 12px; }
      .no-chart { flex: 1; display: flex; align-items: center; justify-content: center; background: var(--card); border-radius: 14px; }

      /* ── 설정: 지표 목록 세 단 (위→아래로 읽고 옆 단으로), 남는 높이를 나눠 갖는다 ── */
      #tab-settings > .card { flex: 1; display: flex; flex-direction: column; margin-bottom: 0; min-height: 0; }
      .settings-info { font-size: 14px; margin: 4px 0 10px; }
      #settings-indicator-list {
        flex: 1; min-height: 0;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        grid-template-rows: repeat(var(--rows, 9), minmax(0, 1fr));
        grid-auto-flow: column;
        gap: 6px 16px;
      }
      .settings-row { margin-bottom: 0; padding: 4px 12px; min-height: 0; }
      .settings-row .ind-name { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .btn-settings-reset { max-width: 420px; margin: 10px auto 0; display: block; }

      /* ── 창: 가운데 ── */
      .modal-backdrop { align-items: center; padding-left: var(--rail-w); }
      .modal { max-width: 520px; border-radius: 24px; padding: 24px 24px 26px; animation: fadeIn .2s ease; }
      .modal-title { font-size: 20px; }

      #toast { bottom: 32px; left: calc(50% + var(--rail-w) / 2); }
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

    /* 태블릿을 세로로 세웠을 때 — 폰 배치 그대로, 폭만 넓힌다 */
    @media (min-width: 700px) and (orientation: portrait) {
      .tab-content > * { width: 100%; max-width: 760px; margin-left: auto; margin-right: auto; }
      #tab-table > * { max-width: none; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header id="header">
  <h1>📊 투자 지표 트래커</h1>
  <button id="btn-sync-open" title="받기 상태" aria-label="받기 상태">☁️<span class="sync-dot" id="sync-dot"></span></button>
</header>

<!-- MAIN -->
<div id="main">

  <!-- DATA TAB — 앱은 받기 전용이다(2026-09-03). 기록은 자동 수집(GitHub Actions)만 쓰고 앱은 서버에서 받기만 한다 -->
  <div id="tab-data" class="tab-content">
    <!-- 최근값 판: 지표마다 가장 최근 값과, 고른 시점(전일·1주·1개월·3개월·1년) 대비 변화.
         태블릿 가로엔 2026-09-28부터 있었고, 2026-11-14부터 폰·폴드에도 보인다(칸 크기는 폰 글자 그대로) -->
    <div class="card home-latest" id="home-latest">
      <div class="latest-head">
        <div class="card-title">최근값 <span class="latest-asof" id="latest-asof"></span></div>
        <div class="seg" id="cmp-seg" role="group" aria-label="견줄 시점">
          <button type="button" data-p="d">전일</button><button type="button" data-p="w">1주</button><button type="button" data-p="m">1개월</button><button type="button" data-p="q">3개월</button><button type="button" data-p="y">1년</button>
        </div>
      </div>
      <div class="latest-note" id="latest-note"></div>
      <div class="latest-grid" id="latest-grid"></div>
    </div>
    <div class="backup-row">
      <button class="btn-backup" id="btn-backup">💾 백업 (내보내기)</button>
    </div>
    <div class="card" id="records-card">
      <div class="card-title">저장된 데이터</div>
      <p class="records-summary" id="records-summary"></p>
      <button type="button" class="btn-toggle" id="btn-toggle-dates">날짜 목록 보기</button>
      <div class="entry-list collapsed" id="entry-list"></div>
    </div>
  </div>

  <!-- TABLE TAB -->
  <div id="tab-table" class="tab-content active">
    <div class="table-wrap" id="table-wrap">
      <div class="no-data">기록을 받는 중입니다…</div>
    </div>
  </div>

  <!-- GRAPH TAB -->
  <div id="tab-graph" class="tab-content">
    <!-- 태블릿 가로 전용 (2026-09-28): 드롭다운 대신 왼쪽 지표 목록. 폰에서는 CSS로 숨긴다 -->
    <div class="ind-picker" id="ind-picker"></div>
    <div class="select-wrap">
      <button type="button" class="ind-step" id="ind-prev" aria-label="이전 지표" title="이전 지표">‹</button>
      <label for="indicator-select">지표</label>
      <select id="indicator-select"></select>
      <button type="button" class="ind-step" id="ind-next" aria-label="다음 지표" title="다음 지표">›</button>
    </div>
    <div id="chart-area">
      <div class="no-chart">지표를 선택하면 그래프가 표시됩니다.</div>
    </div>
  </div>

  <!-- SETTINGS TAB -->
  <div id="tab-settings" class="tab-content">
    <div class="card">
      <div class="card-title">지표 순서 · 숨기기</div>
      <p class="settings-info">표·최근값·그래프에 보이는 지표의 순서와 숨김을 <b>이 기기에서만</b> 바꿉니다. ⋮⋮ 를 끌거나 ↑↓ 로 옮기고, 「숨김」으로 감춥니다.<br>어떤 지표를 모을지는 자동 수집이 정합니다(새 지표는 저절로 나타납니다).</p>
      <div id="settings-indicator-list"></div>
      <button class="btn-settings-reset" id="btn-settings-reset">기본 순서로 되돌리기 (숨김도 풀기)</button>
    </div>
  </div>

</div>

<!-- BOTTOM TAB NAV -->
<nav id="tabnav">
  <button class="tab-btn active" data-tab="table"><span class="icon">📋</span>표</button>
  <button class="tab-btn" data-tab="data"><span class="icon">🗂️</span>데이터</button>
  <button class="tab-btn" data-tab="graph"><span class="icon">📈</span>그래프</button>
  <button class="tab-btn" data-tab="settings"><span class="icon">⚙️</span>설정</button>
</nav>

<!-- 상태 창 (☁️) — 2026-11-14: 동기화 키 칸·연결 해제를 없앴다. 앱은 늘 매일 수집되는 문서 하나(sync/0000)를 받는다 -->
<div class="modal-backdrop" id="modal-sync">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">☁️ 받기 상태</div>
      <button class="modal-close" id="close-sync" aria-label="닫기">✕</button>
    </div>
    <div class="sync-state"><span class="sync-dot" id="sync-dot-modal"></span><span id="sync-status-text">연결 전</span></div>
    <div class="sync-detail" id="sync-detail"></div>
    <div class="sync-rows" id="sync-rows"></div>
    <div class="sync-actions">
      <button class="btn-main" id="btn-sync-refresh">다시 받기</button>
      <button class="btn-main warn" id="btn-sync-force" hidden>줄어든 서버 기록을 그래도 받기</button>
    </div>
    <p class="sync-info">이 앱은 <b>받기 전용</b>입니다. 기록은 평일 아침 10:37쯤 자동 수집이 넣고, 앱은 열 때마다 새 기록을 받아옵니다.<br><span id="app-ver"></span></p>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
'use strict';
const APP_VER = 'v34 · 2026-11-25';

// ── 저장 칸 (이 기기의 localStorage) ──────────────────────────────────
const K = {
  data: 'invest_tracker_v2',                 // 서버 기록의 사본 { 'YYYY-MM-DD': { 지표: 값 } } — 끊긴 채로도 이것으로 연다
  meta: 'invest_meta_v1',                    // { updatedAt, receivedAt, dropped } — 상태 창에 보일 것
  serverInds: 'invest_indicators_server_v1', // 서버가 준 지표 목록(이름·묶음·순서·표기) 원문
  order: 'invest_order_v1',                  // 이 기기에서 바꾼 순서 (이름 배열). 없으면 서버 순서
  hidden: 'invest_hidden_v1',                // 이 기기에서 숨기거나 다시 보이게 한 지표 { 이름: true|false }
  last: 'invest_last_indicator',             // 그래프에서 마지막에 본 지표
  range: 'invest_graph_range',               // 그래프 기간 (1m·3m·1y·all)
  cmp: 'invest_compare_period',              // 최근값 판에서 견줄 시점 (d·w·m·q·y)
  migrated: 'invest_settings_v3',            // 옛 설정 칸을 옮겼다는 표시
};
// 2026-11-14 전의 칸. 한 번 옮기고 지운다(migrateOldSettings). 옛 주소에서 넘어올 때도 이 모양으로 온다(#move=)
const OLD_INDS = 'invest_indicators_v1', OLD_REMOVED = 'invest_indicators_removed_v1';
const OLD_KEYS = [OLD_INDS, OLD_REMOVED, 'invest_sync_key', 'invest_sync_off', 'invest_tracker_v2_ver', 'gold_recalc_troy_v1'];

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
  json(k, fallback) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? fallback : v; } catch (e) { return fallback; } },
};

// ── 지표 ──────────────────────────────────────────────────────────────
// 목록의 원본은 서버 문서의 indicators 칸이다(수집 스크립트 collect.js 가 적는다 — 2026-11-14). 그래서 지표를 더해도
// 기기마다 손볼 것이 없다. 아래는 그 칸을 아직 못 받았을 때(처음 깐 기기가 끊겨 있을 때 등) 쓰는 같은 내용의 사본이다.
//   point  금리처럼 이미 %인 값 — 변화를 %p 로 적고, 그 소수 자릿수

// 서버가 준 목록은 모양을 확인하고 필요한 칸만 옮겨 담는다 (남이 고친 문서여도 화면·저장소에 엉뚱한 것이 들어가지 않게)

  let a; try { a = JSON.parse(raw); } catch (e) { return null; }
  if (!Array.isArray(a) || !a.length || a.length > 200) return null;
  const str = (v, max) => typeof v === 'string' && v.length > 0 && v.length <= max;
  const int = (v, max) => Number.isInteger(v) && v >= 0 && v <= max;
  const out = [], seen = new Set();
  for (const i of a) {
    if (!i || typeof i !== 'object' || !str(i.name, 40) || seen.has(i.name)) continue;
    const o = { name: i.name, group: str(i.group, 20) ? i.group : '기타' };
    if (str(i.unit, 12)) o.unit = i.unit;
    if (int(i.point, 6) && i.point > 0) o.point = i.point;
    if (int(i.digits, 8)) o.digits = i.digits;
    if (i.nochg === true) o.nochg = true;
    if (i.hidden === true) o.hidden = true;
    if (str(i.calc, 80)) o.calc = i.calc;
    if (Array.isArray(i.ratio) && i.ratio.length === 2 && str(i.ratio[0], 40) && str(i.ratio[1], 40)) o.ratio = [i.ratio[0], i.ratio[1]];
    seen.add(o.name); out.push(o);

}

  // 이 기기에서 바꾼 순서. 순서에 없는 지표(나중에 생긴 것)는 원래 목록에서 바로 앞에 있던 지표 뒤에 끼운다

// ── 표기 ──────────────────────────────────────────────────────────────
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
// MM-DD, YY 형식 (예: 03-24, 26)
function fmtDate(d) { if (!d) return ''; const [y, m, day] = String(d).split('-'); return `${m}-${day}, ${String(y).slice(2)}`; }

const TAB_ORDER = ['table', 'data', 'graph', 'settings'];   // 2026-10-12: 첫 화면이 표, 옛 홈은 데이터 탭

const activeTab = () => (document.querySelector('.tab-btn.active') || {}).dataset?.tab || HOME_TAB;

function showTab(tab, swipeDir) {

/* 뒤로 가기 (2026-11-14) — 그전엔 다루지 않아, 창이 열려 있어도 뒤로 가기를 누르면 앱이 꺼졌다.

// ── 옆으로 밀어 탭 전환 ───────────────────────────────────────────────
let swipeStartX = 0, swipeStartY = 0, swipeBlocked = false, sortDragging = false;
const mainEl = document.getElementById('main');
mainEl.addEventListener('touchstart', e => {

  // (2026-11-14 — 태블릿 설정에서 지표를 옆 단으로 끌어다 놓으면 그래프 탭으로 넘어갔다)

mainEl.addEventListener('touchend', e => {

  if (cur === 'graph') return;
  // 표 내부 가로 스크롤 영역은 제외
  if (cur === 'table' && e.target.closest('.table-wrap')) return;
  const dx = e.changedTouches[0].clientX - swipeStartX;
  const dy = e.changedTouches[0].clientY - swipeStartY;
  // 수평 이동이 70px 미만이거나 수직 이동이 더 크면 무시
  if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
  const idx = TAB_ORDER.indexOf(cur);
  if (dx < 0 && idx < TAB_ORDER.length - 1) goTab(TAB_ORDER[idx + 1], 'swipe-right');   // 왼쪽으로 밀기 → 다음 탭
  else if (dx > 0 && idx > 0) goTab(TAB_ORDER[idx - 1], 'swipe-left');                  // 오른쪽으로 밀기 → 이전 탭
}, { passive: true });

TABLET_MQ.addEventListener?.('change', () => { _graphKey = ''; _dataKey = ''; renderActive(); });

// ── 표 ────────────────────────────────────────────────────────────────
// 2026-11-14: 한 번에 최근 60일만 그리고, 오른쪽 끝에 가까워지면 60일씩 더 붙인다.
// 그전엔 열자마자 926일 × 23줄(화면 요소 4만 1천 개)을 다 그리느라 0.5~3초 화면이 멈췄고, 기록이 늘수록 길어졌다
const TABLE_CHUNK = 60;
let _tableKey = '', _tbl = null, _tblRaf = 0;
function tableKey() { return DATA_VER + '|' + indicators().list.map(i => i.name + (i.off ? '-' : '')).join(','); }
function renderTable() {
  const wrap = document.getElementById('table-wrap');
  const key = tableKey();
  if (key === _tableKey && wrap.querySelector('table')) return;
  _tableKey = key;
  if (!DATES.length) {
    _tbl = null;
    wrap.innerHTML = `<div class="no-data">${SYNC.status === 'connected' || SYNC.status === 'missing' ? '기록이 없습니다.' : '기록을 받는 중입니다…<br>인터넷에 연결되면 서버에서 받아옵니다.'}</div>`;
    return;
  }
  const rows = shownIndicators().map(ind => {
    const s = series(ind), chg = new Array(s.length);
    if (!ind.nochg) {
      // 오래된 날부터 훑으며 칸마다 직전 기록값 대비 변화를 만든다 (빈 날·이상값은 건너뛴다)
      let prev = null;
      for (let i = s.length - 1; i >= 0; i--) {
        const v = s[i];
        if (!valid(ind, v)) continue;
        if (prev !== null) chg[i] = fmtChange(v, prev, ind.point || 0);
        prev = v;
      }
    }
    return { ind, s, chg };
  });

  const nameHtml = n => esc(n).replace(/\//g, '/<span class="nm-br"></span>');
  wrap.innerHTML = '<table><thead><tr><th>지표</th></tr></thead><tbody>' +
    rows.map(r => `<tr><td class="nm-link" data-name="${esc(r.ind.name)}">${nameHtml(r.ind.name)}</td></tr>`).join('') + '</tbody></table>';
  wrap.scrollLeft = 0;
  appendTableCols(TABLE_CHUNK);
}
function appendTableCols(n) {
  const wrap = document.getElementById('table-wrap'), table = wrap.querySelector('table');
  if (!_tbl || !table || _tbl.cols >= DATES.length) return;
  const from = _tbl.cols, to = Math.min(DATES.length, from + n);
  let head = '';
  for (let i = from; i < to; i++) head += `<th>${esc(fmtDate(DATES[i]))}</th>`;
  table.tHead.rows[0].insertAdjacentHTML('beforeend', head);
  const trs = table.tBodies[0].rows;
  _tbl.rows.forEach((r, ri) => {
    let html = '';
    for (let i = from; i < to; i++) { const v = r.s[i]; html += `<td>${v !== undefined ? esc(fmtNum(v, r.ind)) : '-'}${r.chg[i] || ''}</td>`; }
    trs[ri].insertAdjacentHTML('beforeend', html);

}
document.getElementById('table-wrap').addEventListener('scroll', () => {
  if (_tblRaf || !_tbl) return;
  _tblRaf = requestAnimationFrame(() => {
    _tblRaf = 0;
    const wrap = document.getElementById('table-wrap');
    // 오른쪽 끝까지 화면 두 개 반 안쪽이면 더 붙인다
    let guard = 0;
    while (_tbl && _tbl.cols < DATES.length && wrap.scrollLeft + wrap.clientWidth * 2.5 > wrap.scrollWidth && guard++ < 6) appendTableCols(TABLE_CHUNK);
  });
}, { passive: true });
// 지표 이름 칸을 누르면 그 지표 그래프로 (2026-11-25 — 데이터 탭 최근값 칸과 같은 방식)
document.getElementById('table-wrap').addEventListener('click', e => {
  const td = e.target.closest('td.nm-link'); if (!td) return;
  store.set(K.last, td.dataset.name);
  _graphSel = td.dataset.name;
  goTab('graph');
});

// ── 데이터 탭: 최근값 판 ──────────────────────────────────────────────
// 견줄 시점은 볼트 「현황.md」와 같은 식이다: 가장 최근 기록일에서 거슬러 올라가, 그 날짜 이전의 가장 가까운 기록값
const CMP = { d: '전일', w: '1주', m: '1개월', q: '3개월', y: '1년' };
function shiftDate(iso, p) {
  const [y, m, d] = iso.split('-').map(Number);
  const t = p === 'w' ? Date.UTC(y, m - 1, d - 7) : p === 'm' ? Date.UTC(y, m - 2, d) : p === 'q' ? Date.UTC(y, m - 4, d) : Date.UTC(y - 1, m - 1, d);
  return new Date(t).toISOString().slice(0, 10);
}
const cmpPeriod = () => { const p = store.get(K.cmp); return CMP[p] ? p : 'd'; };
let _dataKey = '', _datesOpen = false;
function renderData() {
  const key = tableKey() + '|' + cmpPeriod() + '|' + isTablet() + '|' + _datesOpen;
  if (key === _dataKey) return;
  _dataKey = key;
  renderLatest();
  renderRecords();
}
function renderLatest() {
  const p = cmpPeriod();
  document.querySelectorAll('#cmp-seg button').forEach(b => b.classList.toggle('active', b.dataset.p === p));
  const asof = document.getElementById('latest-asof'), note = document.getElementById('latest-note'), grid = document.getElementById('latest-grid');
  if (!DATES.length) { asof.textContent = ''; note.textContent = ''; grid.innerHTML = '<div class="no-data" style="grid-column:1/-1;padding:24px">기록을 받는 중입니다…</div>'; return; }
  const latest = DATES[0];
  const target = p === 'd' ? null : shiftDate(latest, p);
  asof.textContent = `${fmtDate(latest)} 기준`;
  if (target) { const i = DATES.findIndex(d => d <= target); note.textContent = i < 0 ? `${CMP[p]} 전 기록이 없습니다` : `${CMP[p]} 전(${fmtDate(DATES[i])} 기록)과 견줌`; }
  else note.textContent = '직전 기록일과 견줌';
  let html = '';
  for (const ind of shownIndicators()) {
    const cur = findFrom(ind, 0);
    let delta = null;
    if (cur) {
      const then = target ? findFrom(ind, cur.i + 1, target) : findFrom(ind, cur.i + 1);
      if (then) delta = fmtDelta(ind, cur.v, then.v, 2);
    }
    const stale = cur && cur.i > 0 ? `<span class="lt-date">${esc(fmtDate(DATES[cur.i]))}</span>` : '';
    html += `<button class="lt-item" data-name="${esc(ind.name)}">
      <span class="lt-name">${GROUP_EMOJI[ind.group] || '📌'} ${esc(ind.name)}</span>
      <span class="lt-val">${cur ? esc(fmtNum(cur.v, ind)) : '-'}</span>
      <span class="lt-chg ${delta ? delta.cls : ''}">${delta ? esc(delta.text) : '&nbsp;'}${stale}</span>
    </button>`;
  }
  grid.innerHTML = html;
}
function renderRecords() {
  const sum = document.getElementById('records-summary'), list = document.getElementById('entry-list'), btn = document.getElementById('btn-toggle-dates');
  if (!DATES.length) { sum.textContent = '아직 받은 기록이 없습니다.'; list.innerHTML = ''; btn.hidden = true; return; }
  sum.textContent = `${DATES.length.toLocaleString()}일 · ${DATES[DATES.length - 1]} ~ ${DATES[0]}`;
  btn.hidden = false;
  const open = _datesOpen || isTablet();
  btn.textContent = _datesOpen ? '날짜 목록 접기' : `날짜 목록 보기 (${DATES.length.toLocaleString()}일)`;
  list.classList.toggle('collapsed', !_datesOpen);
  // 926줄을 늘 그려 두지 않는다 — 펼쳤을 때(태블릿 가로는 늘 펴 둠)만
  list.innerHTML = !open ? '' : DATES.map(d =>
    `<div class="entry-item"><div><div class="entry-date">${esc(fmtDate(d))}</div><div class="entry-count">지표 ${Object.keys(DATA[d]).length}개</div></div></div>`).join('');
}
document.getElementById('cmp-seg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  store.set(K.cmp, b.dataset.p); renderData();
});
document.getElementById('btn-toggle-dates').addEventListener('click', () => { _datesOpen = !_datesOpen; renderData(); });
// 최근값 칸을 누르면 그 지표 그래프로
document.getElementById('latest-grid').addEventListener('click', e => {
  const btn = e.target.closest('.lt-item'); if (!btn) return;
  store.set(K.last, btn.dataset.name);
  _graphSel = btn.dataset.name;

// 백업 (내보내기) — 이 기기에 받아 둔 기록을 파일로
document.getElementById('btn-backup').addEventListener('click', () => {
  if (!DATES.length) { showToast('백업할 데이터가 없습니다.'); return; }
  const now = new Date();
  const filename = `투자지표_백업_${now.getFullYear()}${pad2(now.getMonth() + 1)}${pad2(now.getDate())}.json`;
  const url = URL.createObjectURL(new Blob([JSON.stringify(DATA, null, 2)], { type: 'application/json' }));
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();

// ── 그래프 ────────────────────────────────────────────────────────────
const RANGES = { '1m': '1개월', '3m': '3개월', '1y': '1년', all: '전체' };
const graphRange = () => { const r = store.get(K.range); return RANGES[r] ? r : 'all'; };
let _graphKey = '', _graphSel = '', chartInstance = null, _chartDates = [];
let _chartWait = 0, _chartTries = 0;      // 그래프 라이브러리를 기다리는 중
let _applying = false, _gesturing = false, _yRaf = 0;   // 기간 단추가 범위를 맞추는 중 · 손으로 끌거나 확대하는 중 · 세로축 맞추기 예약
function renderGraphTab() {
  const list = shownIndicators();
  const gkey = tableKey() + '|' + isTablet() + '|' + _graphSel;
  if (gkey === _graphKey && document.querySelector('#chart-area canvas')) return;
  const sel = document.getElementById('indicator-select');
  // 고를 지표: 방금 고른 것 → 마지막에 본 것 → 목록의 첫 지표 (2026-11-14 — 폰에서는 열 때마다 빈 화면에서 골라야 했다)
  const names = list.map(i => i.name);
  let cur = [_graphSel, sel.value, store.get(K.last)].find(n => n && names.includes(n)) || names[0] || '';
  // 고르는 칸도 묶음별로 (2026-11-25 — 그전엔 26개가 한 줄 목록이었다). 순서는 설정의 순서 그대로, 같은 묶음이 이어지는 동안만 묶는다
  sel.innerHTML = '';
  let og = null, ogName = null;
  for (const i of list) {
    if (i.group !== ogName) { og = document.createElement('optgroup'); og.label = i.group; ogName = i.group; sel.appendChild(og); }
    const o = document.createElement('option'); o.value = i.name; o.textContent = i.name; og.appendChild(o);
  }
  sel.value = cur;
  _graphSel = cur;
  _graphKey = tableKey() + '|' + isTablet() + '|' + _graphSel;
  renderPicker(list);
  if (cur) renderChart(cur);
  else document.getElementById('chart-area').innerHTML = '<div class="no-chart">기록을 받으면 그래프가 표시됩니다.</div>';
}
function pickIndicator(name) {
  _graphSel = name; store.set(K.last, name);
  document.getElementById('indicator-select').value = name;
  markPicker(name);
  _graphKey = tableKey() + '|' + isTablet() + '|' + _graphSel;
  renderChart(name);
}
document.getElementById('indicator-select').addEventListener('change', e => { if (e.target.value) pickIndicator(e.target.value); });
// 이전·다음 지표 (2026-11-25) — 보이는 지표 순서대로 돌고, 끝에서 처음으로 이어진다
function stepIndicator(dir) {
  const names = shownIndicators().map(i => i.name); if (!names.length) return;
  const at = names.indexOf(_graphSel);
  pickIndicator(names[((at < 0 ? 0 : at + dir) + names.length) % names.length]);
}
document.getElementById('ind-prev').addEventListener('click', () => stepIndicator(-1));
document.getElementById('ind-next').addEventListener('click', () => stepIndicator(1));
// 태블릿 가로: 왼쪽 지표 목록 (묶음별)
function renderPicker(list) {
  const box = document.getElementById('ind-picker');
  const groups = new Map();
  for (const i of list) { if (!groups.has(i.group)) groups.set(i.group, []); groups.get(i.group).push(i.name); }
  box.innerHTML = [...groups].map(([g, names]) =>
    `<div class="picker-group"><div class="picker-title">${GROUP_EMOJI[g] || '📌'} ${esc(g)}</div>` +
    names.map(n => `<button class="picker-btn" data-name="${esc(n)}">${esc(n)}</button>`).join('') + `</div>`).join('');
  markPicker(_graphSel);
}
function markPicker(name) {
  let act = null;
  document.querySelectorAll('#ind-picker .picker-btn').forEach(b => { const on = b.dataset.name === name; b.classList.toggle('active', on); if (on) act = b; });
  // 고른 지표가 목록의 화면 밖에 있으면 보이는 데까지 민다 (표에서 이름을 눌러 넘어온 경우 — 2026-11-25)
  if (act && isTablet()) { try { act.scrollIntoView({ block: 'nearest' }); } catch (e) {} }
}
document.getElementById('ind-picker').addEventListener('click', e => {
  const btn = e.target.closest('.picker-btn'); if (btn) pickIndicator(btn.dataset.name);
});

function renderChart(name, again) {
  const area = document.getElementById('chart-area');
  if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
  clearTimeout(_chartWait); cancelAnimationFrame(_yRaf); _yRaf = 0; _gesturing = false;
  if (!again) _chartTries = 0;
  if (typeof Chart === 'undefined') {   // 라이브러리(defer)가 아직 안 왔거나 못 받았다 — 올 때까지 다시 해 본다
    // 2026-11-25: 그전엔 0.4초 뒤 한 번만 다시 해 봐서, 그보다 늦게 오면 「준비하는 중」에 멈춰 있었다
    if (_chartTries++ < 60) {
      area.innerHTML = '<div class="no-chart">그래프를 준비하는 중입니다…</div>';
      _chartWait = setTimeout(() => { if (activeTab() === 'graph' && !chartInstance) renderChart(_graphSel, true); }, 400);
    } else area.innerHTML = '<div class="no-chart">그래프 프로그램을 받지 못했습니다.<br>인터넷 연결을 확인한 뒤 그래프 탭을 다시 눌러 주세요.</div>';
    return;
  }

  let first = -1;
  for (let i = s.length - 1; i >= 0; i--) if (valid(ind, s[i])) { first = i; break; }
  const dates = [], values = [];
  for (let i = first; i >= 0; i--) { dates.push(DATES[i]); values.push(valid(ind, s[i]) ? s[i] : null); }

  // 그릴 값이 하나도 없으면(기록이 전부 빈 값) 빈 그래프 대신 알린다 (2026-11-25)
  if (!values.length) { area.innerHTML = `<div class="no-chart">「${esc(name)}」은(는) 아직 그릴 값이 없습니다.</div>`; return; }
  const r = graphRange();
  area.innerHTML = `
    <div class="chart-card">
      <div class="chart-top">
        <div class="latest-val"><span class="latest-num" id="latest-num">-</span><span class="latest-label">최근값 <span id="latest-date"></span>${ind.unit ? ' · ' + esc(ind.unit) : ''}</span></div>
        <div class="seg" id="range-seg" role="group" aria-label="그래프 기간">${Object.entries(RANGES).map(([k, t]) => `<button type="button" data-r="${k}" class="${k === r ? 'active' : ''}">${t}</button>`).join('')}</div>
      </div>

      <div class="peak-row"><span class="peak-label">🏆 기간 최고</span><span class="peak-val" id="peak-val">-</span><span class="peak-date" id="peak-date"></span><span class="peak-diff" id="peak-diff"></span></div>
      <div class="peak-row low"><span class="peak-label">🔻 기간 최저</span><span class="peak-val" id="low-val">-</span><span class="peak-date" id="low-date"></span><span class="peak-diff" id="low-diff"></span></div>
      <div class="chart-canvas-wrap"><canvas id="my-chart"></canvas></div>
      <p class="chart-hint">누르면 그날 값 · 끌면 이동 · 두 손가락으로 확대/축소</p>

  const tickSize = isTablet() ? 13 : 11;   // 태블릿 가로: 팔 길이에서 보이게 조금 키운다

    plugins: [crosshair],

      responsive: true, maintainAspectRatio: false, animation: false,
      interaction: { mode: 'index', intersect: false },

        // 가로축 눈금: 기울이지 않고, 보이는 구간이 짧으면 「월-일」, 길면 「연.월」 (그전엔 「04-05, 23」 꼴 12개가 45도로 누워 폰에서 축이 56px 을 먹었다)

          ticks: { color: '#64748b', font: { size: tickSize }, maxRotation: 0, autoSkipPadding: 10, maxTicksLimit: 12,
            callback(val) { const d = _chartDates[val]; if (!d) return ''; return (this.max - this.min) <= 70 ? d.slice(5) : d.slice(2, 4) + '.' + d.slice(5, 7); } },
          // 같은 달이 잇달아 찍히면 뒤의 것은 비운다 (눈금을 솎아 낸 뒤에 — afterUpdate)
          afterUpdate(scale) { let prev = null; scale.ticks.forEach(t => { if (t.label === prev) t.label = ''; else if (t.label) prev = t.label; }); } },
        // includeBounds:false — 축 양 끝에 9,861.09 같은 어중간한 눈금이 따로 찍히던 것을 뺀다
        y: { grid: { color: '#f1f5f9' }, ticks: { color: '#64748b', font: { size: tickSize }, includeBounds: false, callback(v) { return fmtAxis(v, ind, this.max); } } }
      },

        // 값 창: 날짜(요일) · 값 · 직전 기록보다 얼마나. 끌거나 확대하는 동안에는 띄우지 않는다
        tooltip: { displayColors: false, filter: () => !_gesturing, callbacks: {
          title: items => { const d = items.length ? _chartDates[items[0].dataIndex] : ''; return d ? `${d} (${dowOf(d)})` : ''; },
          label: ctx => fmtNum(ctx.parsed.y, ind) + unit,
          afterLabel: ctx => {
            let j = ctx.dataIndex - 1; while (j >= 0 && values[j] === null) j--;
            const dl = j >= 0 ? fmtDelta(ind, ctx.parsed.y, values[j], 2) : null;
            return dl ? `직전 기록보다 ${dl.text}` : '';
          },
        } },
        zoom: {

window.addEventListener('online', resubscribe);
window.addEventListener('offline', () => { if (SYNC.status === 'connected' || SYNC.status === 'syncing') setSyncStatus('offline'); });

const SYNC_LABEL = {
  connected: '동기화됨', syncing: '연결 중…', offline: '오프라인', disconnected: '연결 전',
  missing: '서버에 기록 문서가 없습니다', bad: '서버 기록을 읽지 못했습니다', denied: '읽기가 거절됐습니다', shrunk: '서버 기록이 크게 줄었습니다',
};
function setSyncStatus(status, detail) {
  SYNC.status = status; SYNC.detail = detail || '';
  const cls = status === 'connected' || status === 'syncing' || status === 'offline' ? status : status === 'disconnected' ? '' : 'warn';
  [document.getElementById('sync-dot'), document.getElementById('sync-dot-modal')].forEach(d => { if (d) d.className = 'sync-dot' + (cls ? ' ' + cls : ''); });
  renderSyncPanel();
  if (!DATES.length && activeTab() === 'table') { _tableKey = ''; renderTable(); }
}
function renderSyncPanel() {
  const txt = document.getElementById('sync-status-text'); if (!txt) return;
  txt.textContent = SYNC_LABEL[SYNC.status] || SYNC_LABEL.disconnected;
  document.getElementById('sync-detail').textContent = SYNC.detail;
  document.getElementById('btn-sync-force').hidden = SYNC.status !== 'shrunk';
  const meta = store.json(K.meta, {}) || {};
  const rows = [];
  if (DATES.length) {
    const latest = DATES[0], today = (() => { const t = new Date(); return `${t.getFullYear()}-${pad2(t.getMonth() + 1)}-${pad2(t.getDate())}`; })();
    rows.push(['마지막 기록일', `${latest} (${dowOf(latest)}) · 지표 ${Object.keys(DATA[latest]).length}개`]);
    const wd = new Date().getDay();
    rows.push(['오늘 기록', latest >= today ? '들어왔습니다' : (wd === 0 || wd === 6) ? '주말이라 없습니다' : '아직 없습니다 (휴장일이면 안 들어옵니다)']);
    rows.push(['이 기기의 기록', `${DATES.length.toLocaleString()}일 · ${DATES[DATES.length - 1]} 부터`]);
  } else rows.push(['이 기기의 기록', '아직 없습니다']);
  rows.push(['서버 기록이 바뀐 때', fmtStamp(meta.updatedAt)]);
  rows.push(['서버와 맞춰 본 때', fmtStamp(meta.receivedAt)]);
  document.getElementById('sync-rows').innerHTML = rows.map(([a, b]) => `<div class="sync-row"><span>${esc(a)}</span><span>${esc(b)}</span></div>`).join('');
  document.getElementById('app-ver').textContent = '판 ' + APP_VER;
}
document.getElementById('btn-sync-open').addEventListener('click', () => { renderSyncPanel(); openModal('modal-sync'); });
document.getElementById('close-sync').addEventListener('click', () => closeModal());
document.getElementById('modal-sync').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
document.getElementById('btn-sync-refresh').addEventListener('click', () => { resubscribe(); showToast('서버에서 다시 받는 중…'); });
document.getElementById('btn-sync-force').addEventListener('click', () => {
  if (!confirm('줄어든 서버 기록으로 이 기기의 기록을 바꿀까요?\n(바꾸기 전에 데이터 탭의 「백업」으로 지금 기록을 내보내 둘 수 있습니다)')) return;
  forceAccept = true; resubscribe();
});

// ── 주소 이전 (2026-10-15) · 옛 설정 옮기기 ───────────────────────────
// github.io 공용 주소 → 전용 주소 https://minsung-invest.web.app. 옛 주소로 들어오면 맨 위(head) 스크립트가 그 기기의
// 지표 목록·지운 지표를 #move=… 에 담아 바로 넘기고(2026-11-14), 여기서 한 번 받는다. # 뒤는 서버로 가지 않고, 받은 뒤엔 주소창에서 지운다.
// 링크로 들어온 값은 남이 만든 링크일 수도 있으므로 모양을 확인하고(2026-10-20 점검 #2), 이미 설정을 가진 기기는 받지 않는다.
// 동기화 키는 받지 않는다(2026-11-14 — 받는 문서는 하나로 고정)
const _jsonArr = (v, ok) => { try { const a = JSON.parse(v); return Array.isArray(a) && a.every(ok); } catch (e) { return false; } };
const MOVE_VALID = {
  [OLD_INDS]: v => _jsonArr(v, i => i && typeof i === 'object' && typeof i.name === 'string' && i.name.length > 0 && i.name.length <= 30),
  [OLD_REMOVED]: v => _jsonArr(v, s => typeof s === 'string' && s.length <= 30),
};
function b64urlDecode(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return decodeURIComponent(escape(atob(s))); }
function importMovedSettings() {
  const m = /^#move=([A-Za-z0-9_-]+)$/.exec(location.hash || '');
  if (!m) return;
  let n = 0;
  if (!store.get(K.migrated) && !store.get(K.order)) {
    try {
      const data = JSON.parse(b64urlDecode(m[1]));
      Object.keys(MOVE_VALID).forEach(k => {
        if (typeof data[k] !== 'string' || data[k].length > 20000 || store.get(k) !== null) return;
        if (!MOVE_VALID[k](data[k])) return;   // 모양이 다르면 통째로 버린다
        store.set(k, data[k]); n++;
      });
    } catch (e) {}
  }
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  if (n) setTimeout(() => showToast('옛 주소의 설정(지표 순서)을 가져왔습니다'), 800);
}
// 2026-11-14 전의 설정 칸을 새 모양으로 한 번 옮긴다. 옛 목록의 순서가 기본 그대로면(손으로 더한 지표가 맨 뒤에 붙은 것까지)
// 순서를 따로 남기지 않고 서버 순서를 따른다. 손댄 흔적이 있으면 이 기기의 순서로 남긴다
const OLD_DEFAULT_ORDER = ['국채 3년', '국채10년', '미국채 2년', '미국채 10년', '미국채 30년', '원달러환율', '달러인덱스', '코스피지수', '코스닥지수', '나스닥', '다우존스', 'S&P500',
  '국제 금', '금 환산', '금 할인률', '국내 금', '구리', '원유', '비트코인', '삼성전자', '삼성전자우', '삼성우비율'];
function migrateOldSettings() {
  if (store.get(K.migrated)) return;
  try {
    const names = (store.json(OLD_INDS, []) || []).map(i => i && i.name).filter(n => typeof n === 'string' && n.length <= 40);
    if (names.length) {
      const mine = names.filter(n => OLD_DEFAULT_ORDER.includes(n)).join('|');
      const dflt = OLD_DEFAULT_ORDER.filter(n => names.includes(n)).join('|');
      const firstExtra = names.findIndex(n => !OLD_DEFAULT_ORDER.includes(n));
      const lastDefault = names.map(n => OLD_DEFAULT_ORDER.includes(n)).lastIndexOf(true);
      if (mine !== dflt || (firstExtra >= 0 && firstExtra < lastDefault)) store.set(K.order, JSON.stringify(names));
    }
  } catch (e) {}
  OLD_KEYS.forEach(k => store.del(k));
  store.set(K.migrated, '1');
}

// ── 시작 ──────────────────────────────────────────────────────────────
// 옛 주소(github.io)에서는 맨 위(head) 스크립트가 새 주소로 넘기는 중이다(window.__investMoved) — 앱을 띄우지 않는다.
// 띄우면 서버에 붙어 방금 지운 기록 사본을 다시 받고, 서비스워커를 다시 등록한다
if (!window.__investMoved) {
  importMovedSettings();   // 아래에서 설정을 읽기 전에
  migrateOldSettings();
  replaceNav(null);        // 새로고침 전의 뒤로 가기 표시가 남아 있을 수 있어 비우고 시작한다
  loadLocal();
  renderSyncPanel();
  renderTable();           // 첫 화면이 표 (2026-10-12)
  setTimeout(loadFirebase, 0);   // 첫 화면이 그려진 뒤에

  // 서비스워커 등록 (오프라인 지원)
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
}
</script>
